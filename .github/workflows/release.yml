name: Release

# Builds the plugin from source on a version tag (e.g. `0.1.1`), attests the provenance
# of the artifacts, and publishes a GitHub release with the three files Obsidian installs.
# The Obsidian community directory rebuilds the plugin from the lockfile and compares it
# with the release asset, so releases must come from here, not from a local build.
#
# A pre-release tag (e.g. `0.3.1-beta.1`, prepared with `npm run beta -- 0.3.1-beta.1`) is
# checked against manifest-beta.json instead and published as a GitHub pre-release whose
# manifest.json asset carries the beta version. BRAT users can install it; the community
# store ignores it because manifest.json on main still names the stable version.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Check that the tag matches the manifest
        id: kind
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*) file=manifest-beta.json; echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   file=manifest.json;      echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          version=$(node -p "require('./$file').version")
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "$file version ($version) does not match tag (${GITHUB_REF_NAME})" >&2
            exit 1
          fi
          mkdir -p dist
          cp "$file" dist/manifest.json

      - run: npm test

      - run: npm run build

      - name: Collect release files
        run: cp main.js styles.css dist/

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          if [ "${{ steps.kind.outputs.prerelease }}" = "true" ]; then flags="--prerelease"; fi
          notes="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "${GITHUB_REF_NAME}" dist/main.js dist/manifest.json dist/styles.css \
              --title "${GITHUB_REF_NAME}" --notes-file "$notes" $flags
          else
            gh release create "${GITHUB_REF_NAME}" dist/main.js dist/manifest.json dist/styles.css \
              --title "${GITHUB_REF_NAME}" --generate-notes $flags
          fi
