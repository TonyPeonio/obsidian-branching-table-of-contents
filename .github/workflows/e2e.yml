name: E2E

# End-to-end tests in a real Obsidian (wdio-obsidian-service), on the oldest supported version
# (minAppVersion) and the latest one. Linux needs a virtual display; herbstluftwm is a small
# window manager some Obsidian features expect. Locally: `npm run e2e:obsidian`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Cache Obsidian downloads
        uses: actions/cache@v4
        with:
          path: .obsidian-cache
          key: obsidian-cache-${{ runner.os }}-${{ hashFiles('manifest.json', 'package-lock.json') }}
          restore-keys: obsidian-cache-${{ runner.os }}-

      - name: Set up a virtual display
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y herbstluftwm x11-xserver-utils
          export DISPLAY=:99
          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"
          Xvfb $DISPLAY -screen 0 1280x1024x24 +extension GLX -noreset &
          sleep 1
          herbstluftwm &
          sleep 1

      - name: Run e2e tests
        run: npx wdio run ./wdio.conf.mts
        env:
          OBSIDIAN_VERSIONS: earliest latest
